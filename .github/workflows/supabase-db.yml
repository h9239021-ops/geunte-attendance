# Supabase SQL 마이그레이션 자동 적용
# supabase/migrations/ 아래 .sql 파일이 main에 올라오면, 아직 적용 안 된 파일만 순서대로 실행한다.
# (이미 SQL Editor에서 수동 실행한 supabase_schema.sql / data_migration.sql은 여기 넣지 않는다 — 기준선으로 취급)
# 접속 방식: 관리용 열쇠(access token) 대신 DB 접속 주소(Session pooler) + DB 비밀번호로 직접 연결
name: Supabase DB 마이그레이션

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: DB 접속 주소 준비
        run: |
          ENC=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$ENC"
          echo "DB_URL=postgresql://postgres.wvolctqklbmmlzosexel:${ENC}@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
      - name: 적용 예정 목록 (dry-run)
        run: supabase db push --db-url "$DB_URL" --dry-run
      - name: 마이그레이션 적용
        run: supabase db push --db-url "$DB_URL"
